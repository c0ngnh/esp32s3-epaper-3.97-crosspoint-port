; CrossPoint Reader — Waveshare ESP32-S3 ePaper 3.97 (exclusive port)
; Release: 1.3.0-WS397-RC
; Board: ESP32-S3-WROOM-1-N16R8 (16 MB flash QIO, 8 MB OPI PSRAM)

; Synced from crosspoint-reader-waveshare-397
[platformio]
default_envs = esp32_s3_epaper_397
build_cache_dir = .cache

[crosspoint]
version = 1.3.0-WS397-RC

[env:esp32_s3_epaper_397]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
; Avoid DTR/RTS toggling the chip back into ROM download mode when opening the serial monitor
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
; ESP32-S3 USB-JTAG: hard-reset leaves chip in ROM download (boot:0x22).
; watchdog-reset re-samples strap pins so firmware runs after flash.
board_upload.after_reset = watchdog-reset

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x0

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
  -DBOARD_ESP32_S3_EPAPER_397
  -DDISABLE_OTA_UPDATE=1
  -Ilib/hal
  -Isrc
  -Ilib/audio397
  -Ilib/Epub/Epub/converters
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DHELIX_LOGGING_ACTIVE=0

build_unflags =
  -std=gnu++11
  -fexceptions

extra_scripts =
  pre:scripts/check_member_init_order.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/merge_firmware.py

lib_deps =
  BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ ^1.0.0
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  https://github.com/pschatzmann/arduino-libhelix.git
